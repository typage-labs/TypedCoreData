name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS / Xcode ${{ matrix.xcode }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Swift 6.0 compiler floor and a current stable Apple Silicon toolchain.
          # Installed paths: https://github.com/actions/runner-images/tree/main/images/macos
          - runner: macos-15-intel
            xcode: "16.0"
          - runner: macos-26
            xcode: "26.6"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain and SDKs
        run: |
          xcodebuild -version
          xcrun swift --version
          xcodebuild -showsdks
      - name: Record Core Data concurrency declarations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import platform
          import subprocess

          sdk = Path(subprocess.check_output(
              ["xcrun", "--sdk", "macosx", "--show-sdk-path"], text=True).strip())
          framework = sdk / "System/Library/Frameworks/CoreData.framework"
          print(f"Selected SDK: {sdk}")
          for name in ("NSManagedObjectContext", "NSPersistentStoreCoordinator"):
              header = framework / "Headers" / f"{name}.h"
              lines = header.read_text().splitlines()
              print(f"\n{header}:")
              for index, line in enumerate(lines):
                  if f"@interface {name} " in line or line.startswith("- (void)performBlock"):
                      for offset in range(max(0, index - 2), index + 1):
                          print(f"{offset + 1}: {lines[offset]}")
          modules = framework / "Modules/CoreData.swiftmodule"
          architecture = "arm64e" if platform.machine() == "arm64" else "x86_64"
          interface = modules / f"{architecture}-apple-macos.swiftinterface"
          print(f"\n{interface}:")
          owner = ""
          for index, line in enumerate(interface.read_text().splitlines()):
              if line.startswith("extension "):
                  owner = line
              if line.startswith("// swift-") or "func perform" in line:
                  if "func perform" in line:
                      print(owner)
                  print(f"{index + 1}: {line}")
          PY
      - name: Debug tests
        run: swift test -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Release tests
        run: swift test -c release -Xswiftc -strict-concurrency=complete -Xswiftc -warnings-as-errors
      - name: Minimum deployment builds and compiler contracts
        run: python3 Scripts/verify-advanced-apis.py

  ios:
    name: iOS simulator / Xcode 26.6
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Execute real Core Data tests on an available iOS simulator
        # Unavailable services/runtimes fail this job; they are never a runtime pass.
        run: python3 Scripts/test-ios-simulator.py --require-runtime
